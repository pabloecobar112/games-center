<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMES CENTER — Sélection du jeu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='8' width='24' height='16' rx='4' fill='%23071120' stroke='%232DE2FF' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%232DE2FF'/%3E%3Crect x='16' y='14.5' width='14' height='3' fill='%23B8F135'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#05070E; --bg1:#0A0F1E; --panel:#0D1628; --panel2:#111D36;
  --line:#20304F; --line2:#2C4066;
  --cyan:#2DE2FF; --lime:#B8F135; --magenta:#FF3D8A; --violet:#B44DFF;
  --ink:#EAF2FF; --mut:#93A3C2; --mut2:#5F7095;
  --disp:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --body:'Rajdhani','Segoe UI',system-ui,sans-serif;
  --mono:'Share Tech Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh; background:var(--bg0); color:var(--ink);
  font-family:var(--body); display:flex; flex-direction:column;
  background-image:
    radial-gradient(1200px 600px at 50% -10%, rgba(45,226,255,.08), transparent 60%),
    radial-gradient(900px 500px at 90% 110%, rgba(180,77,255,.07), transparent 60%),
    linear-gradient(rgba(32,48,79,.14) 1px, transparent 1px),
    linear-gradient(90deg, rgba(32,48,79,.14) 1px, transparent 1px);
  background-size:auto,auto,44px 44px,44px 44px;
}
header{ text-align:center; padding:56px 20px 28px }
h1{
  font-family:var(--disp); font-size:clamp(2rem,6vw,3.4rem); letter-spacing:.18em;
  text-transform:uppercase;
  background:linear-gradient(90deg,var(--cyan),var(--lime) 55%,var(--magenta));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 18px rgba(45,226,255,.35));
}
.tagline{ margin-top:10px; color:var(--mut); font-size:1.05rem; letter-spacing:.12em; text-transform:uppercase; font-family:var(--mono) }
main{ flex:1; width:min(1100px,100%); margin:0 auto; padding:20px }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:22px }
.card{
  position:relative; background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--line); border-radius:14px; overflow:hidden;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  display:flex; flex-direction:column;
}
.card:hover{ transform:translateY(-4px); border-color:var(--cyan); box-shadow:0 10px 34px rgba(45,226,255,.18) }
.card a.play{ text-decoration:none; color:inherit; display:flex; flex-direction:column; height:100% }
.thumb{ height:150px; display:flex; align-items:center; justify-content:center; font-size:56px;
  background:radial-gradient(circle at 50% 40%, rgba(45,226,255,.12), transparent 70%), #071120;
  border-bottom:1px solid var(--line) }
.info{ padding:16px 18px 20px; display:flex; flex-direction:column; gap:8px; flex:1 }
.name{ font-family:var(--disp); font-size:1.25rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink) }
.desc{ color:var(--mut); font-size:.98rem; line-height:1.45; flex:1 }
.badge{ position:absolute; top:12px; right:12px; font-family:var(--mono); font-size:.7rem;
  padding:4px 10px; border-radius:999px; border:1px solid var(--lime); color:var(--lime);
  background:rgba(184,241,53,.08); letter-spacing:.1em }
.launch{
  margin-top:8px; align-self:flex-start; font-family:var(--disp); letter-spacing:.14em;
  text-transform:uppercase; font-size:.9rem; padding:10px 22px; border-radius:8px;
  border:1px solid var(--cyan); color:var(--cyan); background:rgba(45,226,255,.07);
  transition:background .15s, color .15s, box-shadow .15s;
}
.card:hover .launch{ background:var(--cyan); color:#04121a; box-shadow:0 0 18px rgba(45,226,255,.5) }
.soon{
  border:1px dashed var(--line2); border-radius:14px; min-height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  color:var(--mut2); padding:30px 18px; text-align:center;
}
.soon .plus{ font-size:44px; font-family:var(--disp) }
.soon .txt{ font-family:var(--mono); letter-spacing:.14em; text-transform:uppercase; font-size:.8rem }
footer{ text-align:center; padding:26px 20px 34px; color:var(--mut2); font-family:var(--mono); font-size:.78rem; letter-spacing:.1em }
</style>
</head>
<body>
<header>
  <h1>Games Center</h1>
  <p class="tagline">// Sélectionne un jeu pour lancer la partie //</p>
</header>

<main>
  <div class="grid" id="gameGrid"></div>
</main>

<footer>GAMES CENTER · v1.0 · propulsé en HTML5</footer>

<script>
// ===== Registre des jeux : ajoute ici tes prochains jeux =====
const GAMES = [
  {
    id: "mini-tanks",
    name: "Mini-Tanks",
    subtitle: "Arène Tactique Néon",
    desc: "Des chars, des power-ups et une arène néon. Affronte l'IA dans des duels tactiques rapides et explosifs.",
    icon: "🎯",
    badge: "JOUEUR",
    url: "mini-tanks.html"
  }
];
// =============================================================

const grid = document.getElementById("gameGrid");

for (const g of GAMES) {
  const card = document.createElement("article");
  card.className = "card";
  card.innerHTML = `
    <span class="badge">${g.badge}</span>
    <a class="play" href="${g.url}">
      <div class="thumb">${g.icon}</div>
      <div class="info">
        <div class="name">${g.name} <span style="color:var(--mut2);font-size:.8em">${g.subtitle ? "· " + g.subtitle : ""}</span></div>
        <div class="desc">${g.desc}</div>
        <div class="launch">▶ Lancer</div>
      </div>
    </a>`;
  grid.appendChild(card);
}

// Emplacement "bientôt disponible" pour les futurs jeux
const soon = document.createElement("article");
soon.className = "soon";
soon.innerHTML = `<div class="plus">+</div><div class="txt">Bientôt disponible</div>`;
grid.appendChild(soon);

// Si un seul jeu est disponible, on pourrait auto-lancer — ici on garde le choix visible.
if (GAMES.length === 1) {
  document.querySelector(".tagline").textContent = "// Un seul jeu pour l'instant… mais ça arrive vite //";
}
</script>
</body>
</html>
